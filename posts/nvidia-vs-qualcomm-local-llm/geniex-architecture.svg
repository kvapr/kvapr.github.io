<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667080"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="620" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1d23">GenieX architecture — and where Genie fits</text>

  <!-- App layer -->
  <rect x="80" y="55" width="700" height="48" rx="10" fill="#f6f8fa" stroke="#c9cfd7"/>
  <text x="430" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">Your app</text>
  <text x="430" y="94" text-anchor="middle" font-size="12.5" fill="#555e6a">geniex CLI · Python · Kotlin/Java · Docker · OpenAI-compatible server</text>

  <line x1="430" y1="103" x2="430" y2="126" stroke="#667080" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- SDK layer -->
  <rect x="80" y="130" width="700" height="52" rx="10" fill="#eef1f4" stroke="#c9cfd7"/>
  <text x="430" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">GenieX C SDK</text>
  <text x="430" y="171" text-anchor="middle" font-size="12.5" fill="#555e6a">model pull (Hugging Face / AI Hub) · chat templates · runtime dispatch</text>

  <line x1="250" y1="182" x2="250" y2="214" stroke="#667080" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="610" y1="182" x2="610" y2="214" stroke="#667080" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- llama_cpp runtime -->
  <rect x="80" y="218" width="340" height="150" rx="10" fill="#f4f9ea" stroke="#76b900" stroke-width="1.5"/>
  <text x="100" y="246" font-size="14" font-weight="700" fill="#3d5c00">llama_cpp runtime</text>
  <text x="100" y="272" font-size="12.5" fill="#444c57">GGML kernels — any GGUF from Hugging Face</text>
  <text x="100" y="294" font-size="12.5" fill="#444c57">Per-op dispatch at runtime</text>
  <text x="100" y="316" font-size="12.5" fill="#444c57">No AOT compile · no catalog gate</text>
  <text x="100" y="338" font-size="12.5" fill="#444c57">Runs on CPU / GPU / NPU</text>

  <!-- qairt runtime -->
  <rect x="440" y="218" width="340" height="150" rx="10" fill="#eef1fd" stroke="#3253dc" stroke-width="1.5"/>
  <rect x="688" y="224" width="78" height="22" rx="11" fill="#3253dc"/>
  <text x="727" y="239" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">&#8776; Genie</text>
  <text x="460" y="246" font-size="14" font-weight="700" fill="#20369c">qairt runtime</text>
  <text x="460" y="272" font-size="12.5" fill="#444c57">QAIRT / QNN — catalog bundles from AI Hub</text>
  <text x="460" y="294" font-size="12.5" fill="#444c57">AOT-compiled QNN context binaries</text>
  <text x="460" y="316" font-size="12.5" fill="#444c57">NPU only · peak perf-per-watt</text>
  <text x="460" y="338" font-size="12.5" font-style="italic" fill="#444c57">Genie's old engine role, carried forward</text>

  <!-- arrows to hardware -->
  <line x1="160" y1="368" x2="178" y2="464" stroke="#667080" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="250" y1="368" x2="402" y2="464" stroke="#667080" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="340" y1="368" x2="596" y2="464" stroke="#667080" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="660" y1="368" x2="684" y2="464" stroke="#667080" stroke-width="1.6" marker-end="url(#arr)"/>

  <text x="452" y="404" text-anchor="middle" font-size="11.5" fill="#4c7a00">per-op kernels (ggml-hexagon)</text>
  <text x="740" y="404" text-anchor="middle" font-size="11.5" fill="#3253dc">AOT full-graph binary</text>

  <!-- hardware -->
  <rect x="80" y="470" width="200" height="50" rx="10" fill="#f6f8fa" stroke="#c9cfd7"/>
  <text x="180" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">Kryo CPU</text>
  <rect x="310" y="470" width="200" height="50" rx="10" fill="#f6f8fa" stroke="#c9cfd7"/>
  <text x="410" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">Adreno GPU</text>
  <rect x="540" y="470" width="240" height="50" rx="10" fill="#fff4e5" stroke="#d97706"/>
  <text x="660" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#8a4b00">Hexagon NPU</text>

  <!-- notes -->
  <text x="430" y="560" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666e79">Genie (deprecated) = only the blue box, shipped as a bare C++ library: hand-assembled bundles, no model pull, no server, no GGUF path.</text>
  <text x="430" y="582" text-anchor="middle" font-size="12.5" font-style="italic" fill="#666e79">GenieX adds the SDK layer on top and a second runtime beside it — same peak-perf engine role, plus a road for every other model.</text>
</svg>
